<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Building Massing Model</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --bg: #eef1f4;
    --panel-bg: rgba(255,255,255,0.92);
    --text: #1c2430;
    --muted: #5b6472;
    --accent: #2f6fed;
    --border: #d7dce3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181f;
      --panel-bg: rgba(24,29,38,0.92);
      --text: #eef1f4;
      --muted: #a3adba;
      --accent: #6c9bff;
      --border: #2b3240;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181f;
    --panel-bg: rgba(24,29,38,0.92);
    --text: #eef1f4;
    --muted: #a3adba;
    --accent: #6c9bff;
    --border: #2b3240;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #scene-container { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  #top-bar {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: 14px; right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
    gap: 10px;
    flex-wrap: wrap;
  }
  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    backdrop-filter: blur(10px);
    pointer-events: auto;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
  }
  #title-panel h1 {
    font-size: 15px;
    margin: 0 0 2px 0;
    font-weight: 650;
  }
  #title-panel p {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    max-width: 320px;
  }
  #controls-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 168px;
  }
  #controls-panel label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    cursor: pointer;
    user-select: none;
  }
  #controls-panel input[type="range"] { width: 100%; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  button.viewbtn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 11.5px;
    cursor: pointer;
  }
  button.viewbtn:hover { border-color: var(--accent); color: var(--accent); }

  #hint, #flyHint {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    font-size: 11.5px;
    color: var(--muted);
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
  }

  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    z-index: 100;
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div id="loading">Building model…</div>
<div id="scene-container"></div>

<div id="top-bar">
  <div id="title-panel" class="panel">
    <h1>Office Floor Plan — 3D Massing</h1>
    <p>Boundary traced from your marked-up plan. Tan = walls, dark stanchions = pipe &amp; drape, light blocks = structural columns.</p>
  </div>
  <div id="controls-panel" class="panel">
    <label><input type="checkbox" id="roofToggle"> Show roof</label>
    <label>Wall height
      <input type="range" id="heightSlider" min="6" max="16" step="0.5" value="10">
    </label>
    <div class="btn-row">
      <button class="viewbtn" data-view="iso">Isometric</button>
      <button class="viewbtn" data-view="top">Top</button>
      <button class="viewbtn" data-view="front">Front</button>
      <button class="viewbtn" data-view="street">Street</button>
    </div>
    <button class="viewbtn" id="flyBtn" style="margin-top:2px;">🚶 Free Fly (click to walk)</button>
  </div>
</div>

<div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
<div id="flyHint" style="display:none;">WASD to move · Mouse to look · Space/Shift up-down · Esc to exit</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------- Room data (feet) ----------
  // Exterior footprint digitized from the boundary the user traced in red, in labeled
  // sections so the curved section (a pipe-and-drape curtain per the reference photo,
  // not a solid wall) can be styled differently and rendered as a smooth curve.
  var topWall  = [[108.4, 0.0], [21.2, 0.0]];
  var chamfer  = [[19.27,3.37],[17.46,3.19],[16.3,4.26],[14.88,8.69],[7.27,20.03],[4.3,27.3],[0.3,32.8]];
  var curveRaw = [[0.3,32.8],[0.04,35.81],[5.85,36.35],[9.46,38.65],[23.65,42.55],[38.49,49.29],
                  [51.64,52.66],[58.35,53.19],[66.74,55.14],[80.02,55.67],[84.15,54.79],[94.34,54.79],[94.86,53.72]];
  var eastWing = [[95.12,10.28],[108.02,9.93]];

  // Smooth, EVEN curve: fit a single circular arc through the traced points (least-
  // squares best-fit circle) instead of following the small wobbles of the hand trace.
  var arcCenter = { x: 78.8938, z: -98.7675 };
  var arcRadius = 153.797;
  var arcAngleStart = THREE.MathUtils.degToRad(120.8526);
  var arcAngleEnd = THREE.MathUtils.degToRad(84.0226);
  var curveSmooth = [];
  var ARC_SEGMENTS = 48;
  for (var ai = 0; ai <= ARC_SEGMENTS; ai++) {
    var t = ai / ARC_SEGMENTS;
    var ang = arcAngleStart + (arcAngleEnd - arcAngleStart) * t;
    curveSmooth.push([arcCenter.x + arcRadius * Math.cos(ang), arcCenter.z + arcRadius * Math.sin(ang)]);
  }
  // Pin the endpoints exactly to the traced corners so the arc meets the chamfer and
  // east wing walls with no gap.
  curveSmooth[0] = curveRaw[0].slice();
  curveSmooth[curveSmooth.length - 1] = curveRaw[curveRaw.length - 1].slice();

  var footprint = topWall.concat(chamfer).concat(curveSmooth).concat(eastWing);
  var southCurve = curveSmooth; // reused as the Open Office's south wall

  // Structural columns — digitized from the filled column markers in the plan, which
  // sit at gridlines C, D and E, in two rows (confirmed against the reference photo's
  // square columns).
  var columns = [
    [21.2, 31.1], [50.55, 31.6], [79.96, 30.1],
    [21.2, 40.6], [50.55, 48.8], [79.9, 50.8]
  ];

  var rooms = [
    // Top row, widths taken from the dimension strings on the plan (6'-6", 10'-4", 10'-6",
    // 10'-6", 19'-10", 10'-8", 9'-8", 9'-3"), which sum to 87.2 ft — matching the traced
    // top wall almost exactly.
    { name: "Hallway",        rect: [21.2, 0, 27.7, 16],  color: 0xd8d2c2 },
    { name: "Work Room",       rect: [27.7, 0, 38.03, 16], color: 0xc6b6d9 },
    { name: "Office",       rect: [38.03, 0, 48.53, 16], color: 0xe3c894 },
    { name: "Office",       rect: [48.53, 0, 59.03, 16], color: 0xe3c894 },
    { name: "War Room",        rect: [59.03, 0, 78.86, 16], color: 0xd98f8f },
    { name: "Office",       rect: [78.86, 0, 89.53, 16], color: 0xe3c894 },
    { name: "Merchandise",     rect: [89.53, 0, 95.12, 16], color: 0xb7d3c3 },
    { name: "Office",      poly: [[95.12,0],[108.4,0],[108.02,9.93],[95.12,10.28]], color: 0xe3c894 },

    // West chamfer corner offices, outer edge following the exact traced wall.
    { name: "Office",      poly: [[21.2,0],[19.27,3.37],[17.46,3.19],[16.3,4.26],[14.88,8.69],[14.88,16],[21.2,16]], color: 0xe3c894 },
    { name: "Office",      poly: [[14.88,8.69],[7.27,20.03],[4.3,27.3],[0.3,32.8],[0.04,35.81],[9,32],[16,20],[16,8.69]], color: 0xe3c894 },

    { name: "Open Office",     poly: [[16,16],[89.53,16],[89.53,40]].concat(southCurve.slice().reverse()).concat([[16,20]]), color: 0xf0ece2 },

    // East wing offices, outer/south edge following the traced boundary; west edge and
    // internal splits are approximate (not part of the traced line).
    { name: "Hallway",   rect: [89.53, 10.28, 95.12, 53.72], color: 0xd8d2c2 },
    { name: "Office",      rect: [79.53, 10.28, 89.53, 24.28], color: 0xe3c894 },
    { name: "Office",      rect: [79.53, 24.28, 89.53, 34.78], color: 0xe3c894 },
    { name: "Office",      rect: [79.53, 34.78, 89.53, 45.28], color: 0xe3c894 },
    { name: "Office",      rect: [79.53, 45.28, 89.53, 54.79], color: 0xe3c894 }
  ];

  var WALL_H = 10;       // default height, ft
  var PARTITION_H_RATIO = 0.62; // interior partitions read as lower than exterior walls
  var WALL_T = 0.4;

  // ---------- Three.js setup ----------
  var container = document.getElementById("scene-container");
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeef1f4);
  scene.fog = new THREE.Fog(0xeef1f4, 260, 620);

  var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 3000);
  var target = new THREE.Vector3(54, 0, 26);
  var spherical = { radius: 260, theta: Math.PI * 0.28, phi: Math.PI * 0.32 };

  function updateCamera() {
    var x = target.x + spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
    var y = spherical.radius * Math.cos(spherical.phi);
    var z = target.z + spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
    camera.position.set(x, y, z);
    camera.lookAt(target);
  }
  updateCamera();

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  var sun = new THREE.DirectionalLight(0xffffff, 0.75);
  sun.position.set(120, 180, 90);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0xbcd0ff, 0.25);
  fill.position.set(-100, 80, -60);
  scene.add(fill);

  // Ground
  var groundGeo = new THREE.PlaneGeometry(2000, 2000);
  var groundMat = new THREE.MeshStandardMaterial({ color: 0xdfe6ea, roughness: 1 });
  var ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.05;
  scene.add(ground);

  // ---------- Helpers ----------
  function shapeFromPoints(pts) {
    var shape = new THREE.Shape();
    shape.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
    shape.closePath();
    return shape;
  }
  function rectToPoints(r) {
    return [[r[0], r[1]], [r[2], r[1]], [r[2], r[3]], [r[0], r[3]]];
  }

  var roomGroup = new THREE.Group();
  var labelGroup = new THREE.Group();
  var roofGroup = new THREE.Group();
  scene.add(roomGroup, labelGroup, roofGroup);

  function makeLabelSprite(text) {
    var canvas = document.createElement("canvas");
    var ctx = canvas.getContext("2d");
    var fontSize = 46;
    ctx.font = "700 " + fontSize + "px -apple-system, Arial, sans-serif";
    var padding = 20;
    var w = Math.ceil(ctx.measureText(text).width) + padding * 2;
    var h = fontSize + padding * 1.5;
    canvas.width = w; canvas.height = h;
    ctx.font = "700 " + fontSize + "px -apple-system, Arial, sans-serif";
    ctx.fillStyle = "rgba(14,17,23,0.94)";
    roundRect(ctx, 0, 0, w, h, 14);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 2;
    roundRect(ctx, 1, 1, w - 2, h - 2, 13);
    ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.textBaseline = "middle";
    ctx.fillText(text, padding, h / 2 + 2);
    var tex = new THREE.CanvasTexture(canvas);
    tex.minFilter = THREE.LinearFilter;
    var mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
    var sprite = new THREE.Sprite(mat);
    var scale = 0.1;
    sprite.scale.set(w * scale, h * scale, 1);
    sprite.renderOrder = 999;
    return sprite;
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // "Engraved" room-name text, laid flat into the floor — a shadow offset one way and
  // a highlight offset the other, like a carved/etched groove.
  function makeFloorLabel(text, maxWidthFt) {
    var canvas = document.createElement("canvas");
    var ctx = canvas.getContext("2d");
    var fontSize = 120;
    ctx.font = "700 " + fontSize + "px -apple-system, Arial, sans-serif";
    var textW = ctx.measureText(text).width;
    canvas.width = Math.ceil(textW + 90);
    canvas.height = fontSize + 90;
    ctx.font = "700 " + fontSize + "px -apple-system, Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    var cx = canvas.width / 2, cy = canvas.height / 2;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillText(text, cx + 3, cy + 4);
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.fillText(text, cx - 2, cy - 2);
    ctx.fillStyle = "rgba(80,82,88,0.92)";
    ctx.fillText(text, cx, cy);
    var tex = new THREE.CanvasTexture(canvas);
    tex.minFilter = THREE.LinearFilter;
    var aspect = canvas.width / canvas.height;
    var worldW = maxWidthFt, worldH = worldW / aspect;
    var geo = new THREE.PlaneGeometry(worldW, worldH);
    var mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.renderOrder = 5;
    return mesh;
  }
  function bboxOf(pts) {
    var xs = pts.map(function (p) { return p[0]; });
    var zs = pts.map(function (p) { return p[1]; });
    return { minX: Math.min.apply(null, xs), maxX: Math.max.apply(null, xs), minZ: Math.min.apply(null, zs), maxZ: Math.max.apply(null, zs) };
  }

  function centroid(pts) {
    var cx = 0, cz = 0;
    pts.forEach(function (p) { cx += p[0]; cz += p[1]; });
    return [cx / pts.length, cz / pts.length];
  }

  // The individual room blocks (offices, hallways, work room, etc.) have been removed —
  // only the main open room we're working in remains, as one continuous floor.
  var roomMeshes = [];

  // Exterior shell (thin wall loop following footprint) + floor slab + roof
  var footShape = shapeFromPoints(footprint);
  var floorGeo = new THREE.ShapeGeometry(footShape);
  floorGeo.rotateX(-Math.PI / 2);
  floorGeo.scale(1, 1, -1); // rotateX(-90°) on a flat XY shape negates world Z — flip it back so the floor lands under the walls instead of mirrored to the north

  // Carpet texture (uploaded swatch), tiled across the floor at roughly real-world scale.
  var carpetImg = new Image();
  var carpetTex = new THREE.Texture(carpetImg);
  carpetTex.wrapS = THREE.RepeatWrapping;
  carpetTex.wrapT = THREE.RepeatWrapping;
  carpetImg.onload = function () {
    carpetTex.needsUpdate = true;
    renderer.render(scene, camera);

  // ---------- 5'10" person, for scale reference ----------
  (function addScaleFigure() {
    var TOTAL_H = 5 + 10 / 12; // 5'10" in feet ≈ 5.833
    var legH = TOTAL_H * 0.47, torsoH = TOTAL_H * 0.38, headD = TOTAL_H * 0.15;
    var figMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.6 });
    var figGroup = new THREE.Group();

    var legs = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, legH, 14), figMat);
    legs.position.y = legH / 2;
    figGroup.add(legs);

    var torso = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.5, torsoH, 14), figMat);
    torso.position.y = legH + torsoH / 2;
    figGroup.add(torso);

    var head = new THREE.Mesh(new THREE.SphereGeometry(headD / 2, 16, 12), figMat);
    head.position.y = legH + torsoH + headD / 2;
    figGroup.add(head);

    figGroup.position.set(35, 0, 20); // clear of columns and the stage
    scene.add(figGroup);
  })();

  // ---------- Orbit controls (custom, no extra deps) ----------
  var navMode = "orbit"; // "orbit" | "fly"
  var isDragging = false, isPanning = false, lastX = 0, lastY = 0;
  renderer.domElement.addEventListener("pointerdown", function (e) {
    if (navMode !== "orbit") return;
    if (e.button === 2) isPanning = true; else isDragging = true;
    lastX = e.clientX; lastY = e.clientY;
    renderer.domElement.setPointerCapture(e.pointerId);
  });
  renderer.domElement.addEventListener("pointerup", function () { isDragging = false; isPanning = false; });
  renderer.domElement.addEventListener("pointercancel", function () { isDragging = false; isPanning = false; });
  renderer.domElement.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  renderer.domElement.addEventListener("pointermove", function (e) {
    if (navMode !== "orbit") return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (isDragging) {
      spherical.theta -= dx * 0.006;
      spherical.phi = Math.min(Math.max(spherical.phi - dy * 0.006, 0.08), Math.PI / 2 - 0.02);
      updateCamera();
    } else if (isPanning) {
      var panSpeed = spherical.radius * 0.0016;
      var right = new THREE.Vector3(Math.cos(spherical.theta), 0, -Math.sin(spherical.theta));
      target.addScaledVector(right, -dx * panSpeed);
      target.y += dy * panSpeed;
      updateCamera();
    }
  });
  renderer.domElement.addEventListener("wheel", function (e) {
    if (navMode !== "orbit") return;
    e.preventDefault();
    spherical.radius = Math.min(Math.max(spherical.radius + e.deltaY * 0.35, 40), 700);
    updateCamera();
  }, { passive: false });

  // Touch pinch zoom
  var lastPinchDist = null;
  renderer.domElement.addEventListener("touchmove", function (e) {
    if (navMode !== "orbit") return;
    if (e.touches.length === 2) {
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (lastPinchDist != null) {
        spherical.radius = Math.min(Math.max(spherical.radius - (dist - lastPinchDist) * 0.5, 40), 700);
        updateCamera();
      }
      lastPinchDist = dist;
    }
  }, { passive: true });
  renderer.domElement.addEventListener("touchend", function () { lastPinchDist = null; });

  // ---------- Free-fly walk mode (pointer lock + WASD) ----------
  var flyYaw = spherical.theta, flyPitch = 0;
  var flyKeys = {};
  var flyBtn = document.getElementById("flyBtn");
  var hintEl = document.getElementById("hint");
  var flyHintEl = document.getElementById("flyHint");

  flyBtn.addEventListener("click", function () {
    renderer.domElement.requestPointerLock();
  });
  document.addEventListener("pointerlockchange", function () {
    if (document.pointerLockElement === renderer.domElement) {
      navMode = "fly";
      // Start flying from roughly where the orbit camera currently is, at head height.
      flyYaw = -spherical.theta;
      flyPitch = 0;
      camera.position.y = 5.5;
      hintEl.style.display = "none";
      flyHintEl.style.display = "block";
      flyBtn.textContent = "🚶 Flying (Esc to stop)";
    } else {
      navMode = "orbit";
      hintEl.style.display = "block";
      flyHintEl.style.display = "none";
      flyBtn.textContent = "🚶 Free Fly (click to walk)";
      // Resume orbit around wherever the fly camera ended up.
      target.copy(camera.position).add(new THREE.Vector3(Math.sin(-flyYaw) * -10, -2, Math.cos(-flyYaw) * -10));
      updateCamera();
    }
  });
  document.addEventListener("mousemove", function (e) {
    if (navMode !== "fly") return;
    flyYaw -= e.movementX * 0.0022;
    flyPitch -= e.movementY * 0.0022;
    flyPitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, flyPitch));
  });
  document.addEventListener("keydown", function (e) { flyKeys[e.code] = true; });
  document.addEventListener("keyup", function (e) { flyKeys[e.code] = false; });

  var flyClock = { last: performance.now() };
  function updateFly() {
    var now = performance.now();
    var dt = Math.min((now - flyClock.last) / 1000, 0.1);
    flyClock.last = now;
    if (navMode !== "fly") return;

    camera.rotation.order = "YXZ";
    camera.rotation.y = flyYaw;
    camera.rotation.x = flyPitch;
    camera.rotation.z = 0;

    var speed = (flyKeys.ShiftLeft || flyKeys.ShiftRight) ? 45 : 20;
    var dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    var flatDir = new THREE.Vector3(dir.x, 0, dir.z).normalize();
    var rightDir = new THREE.Vector3(flatDir.z, 0, -flatDir.x);

    var move = new THREE.Vector3();
    if (flyKeys.KeyW) move.add(flatDir);
    if (flyKeys.KeyS) move.sub(flatDir);
    if (flyKeys.KeyD) move.sub(rightDir);
    if (flyKeys.KeyA) move.add(rightDir);
    if (move.lengthSq() > 0) move.normalize().multiplyScalar(speed * dt);
    camera.position.add(move);

    if (flyKeys.Space) camera.position.y += speed * dt;
    if (flyKeys.ControlLeft || flyKeys.KeyC) camera.position.y -= speed * dt;
    camera.position.y = Math.max(1.5, camera.position.y);
  }

  // ---------- UI ----------
  document.getElementById("roofToggle").addEventListener("change", function (e) {
    roof.visible = e.target.checked;
  });
  document.getElementById("heightSlider").addEventListener("input", function (e) {
    applyHeight(parseFloat(e.target.value));
  });
  document.querySelectorAll(".viewbtn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var v = btn.getAttribute("data-view");
      if (v === "iso") { spherical.radius = 260; spherical.theta = Math.PI * 0.28; spherical.phi = Math.PI * 0.32; target.set(54, 0, 26); }
      if (v === "top") { spherical.radius = 260; spherical.theta = 0.001; spherical.phi = 0.05; target.set(54, 0, 26); }
      if (v === "front") { spherical.radius = 240; spherical.theta = 0; spherical.phi = Math.PI * 0.42; target.set(54, 5, 26); }
      if (v === "street") { spherical.radius = 110; spherical.theta = Math.PI * 0.55; spherical.phi = Math.PI * 0.42; target.set(25, 3, 32); }
      updateCamera();
    });
  });

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  document.getElementById("loading").style.display = "none";

  function animate() {
    requestAnimationFrame(animate);
    updateFly();
    labelGroup.children.forEach(function (s) { s.quaternion.copy(camera.quaternion); });
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
